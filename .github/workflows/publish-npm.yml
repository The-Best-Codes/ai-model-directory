name: Publish npm package

on:
  workflow_run:
    workflows: ["Update Model Lists"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install

      - name: Bump patch version
        working-directory: packages/npm
        run: |
          NEW_VERSION=$(node -e "const p=require('./package.json');const v=p.version.split('.').map(Number);console.log(v[0]+'.'+v[1]+'.'+(v[2]+1))")
          npm pkg set version="$NEW_VERSION"
          echo "Bumped to $NEW_VERSION"

      - name: Build package
        working-directory: packages/npm
        run: bun run build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/npm/package.json
          if git diff --staged --quiet; then
            echo "No version change to commit"
          else
            VERSION=$(node -p "require('./packages/npm/package.json').version")
            git add .
            git commit -m "chore(bot): release ai-model-directory v${VERSION} [skip cd]"
            git push
          fi

      - name: Publish to npm
        working-directory: packages/npm
        run: npm publish --access public
